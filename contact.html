<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | World Weather Hub</title>
    <meta name="description" content="Contact World Weather Hub for any queries, feedback, or support.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Contact Form Styles */
        .contact-form-box { background: #fff; padding: 20px; border-radius: 12px; margin: 15px; border: 1px solid #dadce0; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #202124; margin-bottom: 5px; font-weight: 500; }
        .input-group input, .input-group textarea { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .input-group input:focus, .input-group textarea:focus { border-color: #1a73e8; }
        
        /* Popup Styles */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .popup-box { background: #fff; padding: 30px; border-radius: 16px; text-align: center; max-width: 320px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .popup-icon { font-size: 55px; color: #34a853; margin-bottom: 15px; }
        .popup-box h2 { font-size: 22px; color: #202124; margin-bottom: 10px; margin-top: 0; }
        .popup-box p { font-size: 14px; color: #5f6368; margin-bottom: 24px; line-height: 1.5; }
        
        @keyframes popIn { 
            0% { transform: scale(0.8); opacity: 0; } 
            100% { transform: scale(1); opacity: 1; } 
        }
    </style>
</head>
<body>
    <div class="main-container wider-container" style="max-width: 900px !important;">
        <header class="compact-header">
            <div class="header-left">
                <a href="index.html" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></a>
                <div class="brand-logo"><span class="brand-text">Contact Us</span></div>
            </div>
        </header>

        <div class="contact-form-box">
            <div style="text-align:center; margin-bottom: 20px;">
                <i class="fa-solid fa-envelope-open-text text-primary" style="font-size:40px; margin-bottom:10px;"></i>
                <h1 style="font-size:22px; margin-bottom:5px; color:#202124;">Get In Touch</h1>
                <p style="font-size:13px; color:#5f6368;">Send us a message and we'll respond as soon as possible.</p>
            </div>

            <form id="contactForm">
                <div class="input-group">
                    <label for="userName">Your Name</label>
                    <input type="text" id="userName" name="name" placeholder="Enter your name" required>
                </div>
                <div class="input-group">
                    <label for="userEmail">Your Email</label>
                    <input type="email" id="userEmail" name="email" placeholder="Enter your email address" required>
                </div>
                <div class="input-group">
                    <label for="userMessage">Message</label>
                    <textarea id="userMessage" name="message" rows="4" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" id="submitBtn" class="orange-search-btn" style="width:100%; justify-content:center; padding:12px; font-size:15px;">
                    <i class="fa-solid fa-paper-plane"></i> Send Message
                </button>
            </form>
        </div>

        <!-- Success Popup (Hidden by default) -->
        <div id="successPopup" class="popup-overlay" style="display: none;">
            <div class="popup-box">
                <i class="fa-solid fa-circle-check popup-icon"></i>
                <h2>Message Sent!</h2>
                <p>Thank you for reaching out. We have received your message and will get back to you soon.</p>
                <button onclick="closePopup()" class="orange-search-btn" style="width:100%; justify-content:center;">Okay</button>
            </div>
        </div>
        
        <nav class="bottom-nav">
            <a href="index.html" class="b-nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="about.html" class="b-nav-item"><i class="fa-solid fa-circle-info"></i><span>About</span></a>
            <a href="contact.html" class="b-nav-item active"><i class="fa-solid fa-envelope"></i><span>Contact</span></a>
        </nav>
    </div>

    <script>
        // Email ko Base64 format me encrypt kiya gaya hai taaki koi bot na padh sake.
        // Ye decode hokar rajendrajat08111@gmail.com ban jayega.
        const encodedEmail = "cmFqZW5kcmFqYXQwODExMUBnbWFpbC5jb20="; 

        document.getElementById("contactForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Page reload hone se rokega
            
            const btn = document.getElementById("submitBtn");
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;

            const formData = new FormData(this);
            const decodedEmail = atob(encodedEmail); // Hidden email ko decode karna
            
            // FormSubmit API ka use karke background me email bhejna
            fetch(`https://formsubmit.co/ajax/${decodedEmail}`, {
                method: "POST",
                headers: {
                    'Accept': 'application/json'
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // Email send hone ke baad Popup dikhana
                document.getElementById("successPopup").style.display = "flex";
                document.getElementById("contactForm").reset();
                btn.innerHTML = originalText;
                btn.disabled = false;
            })
            .catch(error => {
                console.log(error);
                alert("Something went wrong. Please try again.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        });

        // Popup close karne ka function
        function closePopup() {
            document.getElementById("successPopup").style.display = "none";
        }
    </script>
</body>
</html>
